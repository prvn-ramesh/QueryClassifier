[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "queryclf"
version = "0.1.1"
description = "Ultra-fast, lightweight ONNX query difficulty classifier for pre-routing LLM cascades"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Praveen Ramesh" }
]
keywords = ["llm", "routing", "query-complexity", "onnx", "fastembed", "modernbert"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "onnxruntime>=1.17.0",
    "tokenizers>=0.19.0",
    "numpy>=1.24.0",
    "huggingface-hub>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/prvn-ramesh/QueryClassifier"
Repository = "https://github.com/prvn-ramesh/QueryClassifier"
"Model Hub" = "https://huggingface.co/prvn-ramesh/query-classifier-onnx"
"Bug Tracker" = "https://github.com/prvn-ramesh/QueryClassifier/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
queryclf = "query_classifier.cli:main"
query-classifier = "query_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
